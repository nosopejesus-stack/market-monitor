# Para servidores con GPU NVIDIA:
#   COMFYUI_TORCH_INDEX_URL=https://download.pytorch.org/whl/cu124 y COMFYUI_DEVICE_FLAG=--normalvram en .env
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  comfyui:
    deploy:
      resources:
        reservations:
          devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
