# Stack de servicios que trabajan junto a Claude.
#   n8n       -> automatizaciones y servidor MCP para Claude   :5678
#   Chatwoot  -> atención al cliente (web + worker)            :3000
#   Ollama    -> modelos de IA locales                          :11434
#   Umami     -> analytics web                                  :3001
#   ComfyUI   -> generación de imágenes                         :8188
# Coolify (PaaS) se instala en el servidor con scripts/install-coolify.sh
# y despliega este mismo archivo como recurso "Docker Compose".

x-chatwoot-env: &chatwoot-env
  RAILS_ENV: production
  NODE_ENV: production
  INSTALLATION_ENV: docker
  SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE:?generar con scripts/generate-env.sh}
  FRONTEND_URL: ${CHATWOOT_URL:-http://localhost:3000}
  DEFAULT_LOCALE: es
  ENABLE_ACCOUNT_SIGNUP: "false"
  POSTGRES_HOST: postgres
  POSTGRES_USERNAME: chatwoot
  POSTGRES_PASSWORD: ${CHATWOOT_DB_PASSWORD:?falta}
  POSTGRES_DATABASE: chatwoot
  REDIS_URL: redis://:${REDIS_PASSWORD:?falta}@redis:6379
  REDIS_PASSWORD: ${REDIS_PASSWORD}
  ACTIVE_STORAGE_SERVICE: local
  RAILS_LOG_TO_STDOUT: "true"

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:?falta}
      CHATWOOT_DB_PASSWORD: ${CHATWOOT_DB_PASSWORD}
      UMAMI_DB_PASSWORD: ${UMAMI_DB_PASSWORD:?falta}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres && psql -U postgres -tAc \"select 1 from pg_database where datname='umami'\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-latest}
    restart: unless-stopped
    ports: ["${N8N_PORT:-5678}:5678"]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?falta}
      N8N_HOST: ${N8N_HOST:-localhost}
      WEBHOOK_URL: ${N8N_URL:-http://localhost:5678/}
      N8N_SECURE_COOKIE: ${N8N_SECURE_COOKIE:-false}
      GENERIC_TIMEZONE: ${TZ:-Europe/Madrid}
      TZ: ${TZ:-Europe/Madrid}
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_ENABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  chatwoot-migrate:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-latest}
    environment: *chatwoot-env
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: "no"

  chatwoot-web:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-latest}
    restart: unless-stopped
    ports: ["${CHATWOOT_PORT:-3000}:3000"]
    environment: *chatwoot-env
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      chatwoot-migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60

  chatwoot-worker:
    image: chatwoot/chatwoot:${CHATWOOT_VERSION:-latest}
    restart: unless-stopped
    environment: *chatwoot-env
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    volumes:
      - chatwoot_storage:/app/storage
    depends_on:
      chatwoot-migrate: {condition: service_completed_successfully}

  ollama:
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    restart: unless-stopped
    ports: ["${OLLAMA_PORT:-11434}:11434"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-pull:
    # Descarga los modelos de OLLAMA_MODELS la primera vez (luego quedan en el volumen)
    image: ollama/ollama:${OLLAMA_VERSION:-latest}
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODELS_TO_PULL: ${OLLAMA_MODELS:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c", "for m in $$OLLAMA_MODELS_TO_PULL; do ollama pull $$m || exit 1; done"]
    depends_on:
      ollama: {condition: service_healthy}
    restart: "no"

  umami:
    image: ghcr.io/umami-software/umami:${UMAMI_VERSION:-postgresql-latest}
    restart: unless-stopped
    ports: ["${UMAMI_PORT:-3001}:3000"]
    environment:
      DATABASE_URL: postgresql://umami:${UMAMI_DB_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${UMAMI_APP_SECRET:?falta}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  comfyui:
    build:
      context: ./comfyui
      args:
        TORCH_INDEX_URL: ${COMFYUI_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
        COMFYUI_REF: ${COMFYUI_REF:-master}
    image: local/comfyui:${COMFYUI_REF:-master}
    restart: unless-stopped
    ports: ["${COMFYUI_PORT:-8188}:8188"]
    command: ["python", "main.py", "--listen", "0.0.0.0", "--port", "8188", "${COMFYUI_DEVICE_FLAG:---cpu}"]
    volumes:
      - comfyui_models:/app/models
      - comfyui_output:/app/output
      - comfyui_input:/app/input
      - comfyui_custom_nodes:/app/custom_nodes
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://localhost:8188/system_stats')\""]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  postgres_data:
  redis_data:
  n8n_data:
  chatwoot_storage:
  ollama_data:
  comfyui_models:
  comfyui_output:
  comfyui_input:
  comfyui_custom_nodes:
