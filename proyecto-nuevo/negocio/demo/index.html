<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#075E54">
<title>Demo · Respuesta inmediata a leads</title>
<style>
  :root {
    --marca: #075E54;
    --marca-texto: #ffffff;
    --fondo-chat: #efeae2;
    --burbuja-salida: #d9fdd3;
    --burbuja-entrada: #ffffff;
    --texto: #111b21;
    --texto-suave: #667781;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--texto);
    background: #d1d7db;
    display: flex;
    justify-content: center;
    -webkit-text-size-adjust: 100%;
  }
  .app {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--fondo-chat);
    position: relative;
    overflow: hidden;
    box-shadow: 0 0 24px rgba(0,0,0,.15);
  }
  .aviso {
    background: #fff3cd;
    color: #664d03;
    font-size: 12px;
    text-align: center;
    padding: 4px 8px;
    border-bottom: 1px solid #ffe69c;
  }
  .aviso[hidden] { display: none; }
  .barra-demo {
    background: #111b21;
    color: #e9edef;
    font-size: 12px;
    padding: 6px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .barra-demo .titulo { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .barra-demo button {
    background: #2a3942; color: #e9edef; border: 0; border-radius: 12px;
    padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  header.chat {
    background: var(--marca);
    color: var(--marca-texto);
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
  }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; flex-shrink: 0;
  }
  .cabecera-texto { flex: 1; min-width: 0; }
  .cabecera-texto .nombre { font-weight: 600; font-size: 16px; }
  .cabecera-texto .estado { font-size: 12px; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pisos {
    display: flex; gap: 6px; padding: 6px 8px; overflow-x: auto;
    background: #f0f2f5; border-bottom: 1px solid #d1d7db;
  }
  .pisos button {
    flex-shrink: 0; border: 1px solid #c9d1d6; background: #fff; color: var(--texto);
    border-radius: 14px; padding: 5px 10px; font-size: 12px; cursor: pointer;
  }
  .pisos button.activo { background: var(--marca); color: var(--marca-texto); border-color: var(--marca); }
  main#chat {
    flex: 1;
    overflow-y: auto;
    padding: 10px 10px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    scroll-behavior: smooth;
  }
  .fecha {
    align-self: center; background: #fff; color: var(--texto-suave);
    font-size: 12px; padding: 4px 10px; border-radius: 8px; margin: 6px 0;
    box-shadow: 0 1px .5px rgba(0,0,0,.13);
  }
  .sistema {
    align-self: center; background: #ffeecd; color: #54656f;
    font-size: 12px; padding: 5px 10px; border-radius: 8px; margin: 6px 0;
    text-align: center; max-width: 90%;
    box-shadow: 0 1px .5px rgba(0,0,0,.13);
  }
  .sistema.ok { background: #d1f4e0; color: #0b5132; }
  .msg {
    max-width: 82%;
    padding: 6px 8px 4px 9px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.35;
    box-shadow: 0 1px .5px rgba(0,0,0,.13);
    white-space: pre-wrap;
    word-wrap: break-word;
    animation: entra .18s ease-out;
  }
  .msg.entrada { align-self: flex-start; background: var(--burbuja-entrada); border-top-left-radius: 0; }
  .msg.salida { align-self: flex-end; background: var(--burbuja-salida); border-top-right-radius: 0; }
  .msg .meta {
    display: block; text-align: right; font-size: 11px; color: var(--texto-suave);
    margin-top: 2px; white-space: nowrap;
  }
  .msg .ticks { color: #53bdeb; margin-left: 3px; }
  .msg .etiqueta { display: block; font-size: 12px; font-weight: 600; color: var(--marca); margin-bottom: 2px; }
  .opciones { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  .opciones span {
    display: block; text-align: center; background: #fff; color: #027eb5;
    border-radius: 6px; padding: 7px; font-size: 14px; border: 1px solid #e3e8eb;
  }
  .opciones span.elegida { background: #e7f3fb; font-weight: 600; }
  .escribiendo {
    align-self: flex-end; background: var(--burbuja-salida); border-radius: 8px;
    padding: 10px 12px; display: flex; gap: 4px; box-shadow: 0 1px .5px rgba(0,0,0,.13);
  }
  .escribiendo.entrada { align-self: flex-start; background: #fff; }
  .escribiendo i {
    width: 7px; height: 7px; border-radius: 50%; background: #8696a0; display: block;
    animation: punto 1s infinite ease-in-out;
  }
  .escribiendo i:nth-child(2) { animation-delay: .15s; }
  .escribiendo i:nth-child(3) { animation-delay: .3s; }
  .crono {
    align-self: flex-end; font-size: 11px; color: #0b5132; background: #d1f4e0;
    padding: 2px 8px; border-radius: 10px; margin: 0 0 4px;
  }
  @keyframes punto { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-4px); opacity: 1; } }
  @keyframes entra { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
  footer.entrada-texto {
    background: #f0f2f5; padding: 8px; display: flex; gap: 8px; align-items: center;
  }
  footer.entrada-texto .caja {
    flex: 1; background: #fff; border-radius: 20px; padding: 10px 14px; color: var(--texto-suave); font-size: 14px;
  }
  footer.entrada-texto button {
    border: 0; border-radius: 20px; padding: 10px 14px; font-size: 14px; font-weight: 600;
    background: var(--marca); color: var(--marca-texto); cursor: pointer;
  }
  /* Ficha del lead */
  .ficha-fondo {
    position: absolute; inset: 0; background: rgba(17,27,33,.55);
    display: flex; align-items: flex-end; justify-content: center; z-index: 10;
  }
  .ficha-fondo[hidden] { display: none; }
  .ficha {
    background: #fff; width: 100%; max-height: 92%; overflow-y: auto;
    border-radius: 16px 16px 0 0; padding: 0 0 16px; animation: sube .25s ease-out;
  }
  @keyframes sube { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .ficha .cab {
    background: var(--marca); color: var(--marca-texto); padding: 14px 16px; border-radius: 16px 16px 0 0;
  }
  .ficha .cab .sup { font-size: 12px; opacity: .85; }
  .ficha .cab h2 { margin: 2px 0 6px; font-size: 20px; }
  .insignia {
    display: inline-block; background: #fff; color: #0b5132; font-weight: 700; font-size: 12px;
    padding: 3px 8px; border-radius: 10px;
  }
  .ficha dl { margin: 0; padding: 8px 16px; display: grid; grid-template-columns: 38% 62%; row-gap: 8px; }
  .ficha dt { color: var(--texto-suave); font-size: 13px; }
  .ficha dd { margin: 0; font-size: 14px; font-weight: 500; }
  .ficha .resumen {
    margin: 4px 16px 10px; background: #f0f2f5; border-radius: 10px; padding: 10px 12px; font-size: 14px; line-height: 1.4;
  }
  .ficha .resumen b { display: block; font-size: 12px; color: var(--texto-suave); margin-bottom: 4px; font-weight: 600; }
  .ficha .metricas { display: flex; gap: 8px; padding: 12px 16px; }
  .ficha .metricas div {
    flex: 1; background: #f7f8fa; border: 1px solid #e3e8eb; border-radius: 10px; padding: 8px; text-align: center;
  }
  .ficha .metricas strong { display: block; font-size: 18px; color: var(--marca); }
  .ficha .metricas span { font-size: 11px; color: var(--texto-suave); }
  .ficha .acciones { display: flex; gap: 8px; padding: 0 16px; }
  .ficha .acciones button {
    flex: 1; border: 0; border-radius: 10px; padding: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
  }
  .ficha .acciones .prim { background: var(--marca); color: var(--marca-texto); }
  .ficha .acciones .sec { background: #e9edef; color: var(--texto); }
  .ficha .pie { font-size: 11px; color: var(--texto-suave); text-align: center; padding: 10px 16px 0; }
</style>
</head>
<body>
<div class="app">
  <div class="aviso" id="aviso" hidden></div>
  <div class="barra-demo">
    <span class="titulo" id="titulo-demo">Demo</span>
    <button type="button" id="btn-velocidad" aria-label="Cambiar velocidad">x1</button>
    <button type="button" id="btn-reiniciar">Repetir</button>
  </div>
  <header class="chat">
    <div class="avatar" id="avatar">?</div>
    <div class="cabecera-texto">
      <div class="nombre" id="nombre-lead">Lead</div>
      <div class="estado" id="estado-lead">WhatsApp Business · en línea</div>
    </div>
  </header>
  <nav class="pisos" id="pisos" aria-label="Elegir piso de la demo"></nav>
  <main id="chat" aria-live="polite"></main>
  <footer class="entrada-texto">
    <div class="caja" id="caja-texto">Asistente automático activo 24/7</div>
    <button type="button" id="btn-ficha" disabled>Ficha</button>
  </footer>

  <div class="ficha-fondo" id="ficha-fondo" hidden>
    <section class="ficha" role="dialog" aria-modal="true" aria-labelledby="ficha-nombre">
      <div class="cab">
        <div class="sup" id="ficha-sup">Lead cualificado</div>
        <h2 id="ficha-nombre">Lead</h2>
        <span class="insignia" id="ficha-insignia">CUALIFICADO</span>
      </div>
      <div class="metricas">
        <div><strong id="m-resp">-</strong><span>1.ª respuesta</span></div>
        <div><strong id="m-total">-</strong><span>de lead a visita</span></div>
        <div><strong id="m-humano">0 min</strong><span>tiempo del agente</span></div>
      </div>
      <dl id="ficha-datos"></dl>
      <div class="resumen"><b>Resumen para el agente</b><span id="ficha-resumen"></span></div>
      <div class="acciones">
        <button type="button" class="sec" id="btn-cerrar">Ver chat</button>
        <button type="button" class="prim" id="btn-repetir">Repetir demo</button>
      </div>
      <div class="pie" id="ficha-pie">Simulación. Así vería el agente cada lead en su móvil o CRM.</div>
    </section>
  </div>
</div>

<script id="config" type="application/json">
/*CONFIG_INICIO*/{
  "ejemplo": true,
  "agencia": {
    "nombre": "Inmobiliaria Ejemplo (ficticia)",
    "color": "#0f5f8c",
    "agente": "Laura (agente ficticia)",
    "asistente": "Sofía"
  },
  "lead": { "nombre": "Carlos M. (lead ficticio)", "hora": "21:47" },
  "pisos": [
    { "ref": "EJ-001", "direccion": "Calle del Ejemplo, 12", "barrio": "Chamberí", "precio": 425000, "m2": 78, "habitaciones": 2 },
    { "ref": "EJ-002", "direccion": "Avenida Ficticia, 5", "barrio": "Retiro", "precio": 610000, "m2": 104, "habitaciones": 3 }
  ]
}/*CONFIG_FIN*/
</script>
<script>
(function () {
  "use strict";

  // ---------- Configuración ----------
  var raw = document.getElementById("config").textContent;
  raw = raw.replace(/\/\*CONFIG_(INICIO|FIN)\*\//g, "");
  var CFG = JSON.parse(raw);
  var AG = CFG.agencia || {};
  var LEAD = CFG.lead || {};
  var PISOS = CFG.pisos || [];
  var nombreLead = LEAD.nombre || "Lead de Idealista";
  var primerNombre = nombreLead.split(" ")[0];
  var agente = AG.agente || "tu agente";
  var asistente = AG.asistente || "Sofía";

  function $(id) { return document.getElementById(id); }

  // Color de marca y contraste del texto
  function textoSobre(hex) {
    var m = /^#?([0-9a-f]{6})$/i.exec(hex || "");
    if (!m) return "#ffffff";
    var n = parseInt(m[1], 16);
    var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    return lum > 0.6 ? "#111b21" : "#ffffff";
  }
  if (/^#[0-9a-f]{6}$/i.test(AG.color || "")) {
    document.documentElement.style.setProperty("--marca", AG.color);
    document.documentElement.style.setProperty("--marca-texto", textoSobre(AG.color));
    var meta = document.querySelector('meta[name="theme-color"]');
    if (meta) meta.setAttribute("content", AG.color);
  }

  if (CFG.ejemplo) {
    $("aviso").textContent = "EJEMPLO: agencia, pisos y lead son ficticios.";
    $("aviso").hidden = false;
  }
  document.title = "Demo · " + (AG.nombre || "Agencia");
  $("titulo-demo").textContent = "Demo · " + (AG.nombre || "Agencia");
  $("nombre-lead").textContent = nombreLead;
  $("avatar").textContent = primerNombre.charAt(0).toUpperCase();
  $("estado-lead").textContent = "WhatsApp de " + (AG.nombre || "la agencia") + " · asistente activo";

  // ---------- Utilidades ----------
  var fmtEur = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  function eur(n) { return fmtEur.format(n); }
  function redondeaArriba(n, paso) { return Math.ceil(n / paso) * paso; }

  function parseHora(h) {
    var m = /^(\d{1,2}):(\d{2})$/.exec(h || "");
    var d = new Date();
    if (m) d.setHours(+m[1], +m[2], 0, 0);
    return d;
  }
  function hhmm(d) {
    return String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  var fmtDia = new Intl.DateTimeFormat("es-ES", { weekday: "long", day: "numeric", month: "long" });
  function huecos() {
    // Dos próximos huecos en días laborables (lunes a sábado), a partir de mañana.
    var res = [], d = new Date(), horas = [[18, 0], [11, 30]];
    while (res.length < 2) {
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1);
      if (d.getDay() === 0) continue;
      var h = horas[res.length];
      res.push(fmtDia.format(d) + " a las " + String(h[0]).padStart(2, "0") + ":" + String(h[1]).padStart(2, "0"));
    }
    return res;
  }

  // ---------- Motor de reproducción ----------
  var velocidad = 1;
  var temporizadores = [];
  var ejecucion = 0;
  var chat = $("chat");

  function limpiar() {
    ejecucion++;
    temporizadores.forEach(clearTimeout);
    temporizadores = [];
    chat.innerHTML = "";
    $("btn-ficha").disabled = true;
    $("ficha-fondo").hidden = true;
  }
  function bajar() { chat.scrollTop = chat.scrollHeight; }

  function nodo(tag, clase, texto) {
    var el = document.createElement(tag);
    if (clase) el.className = clase;
    if (texto != null) el.textContent = texto;
    return el;
  }

  function burbuja(lado, texto, hora, extra) {
    var el = nodo("div", "msg " + lado);
    if (extra && extra.etiqueta) el.appendChild(nodo("span", "etiqueta", extra.etiqueta));
    el.appendChild(document.createTextNode(texto));
    if (extra && extra.opciones) {
      var ops = nodo("div", "opciones");
      extra.opciones.forEach(function (o, i) {
        var s = nodo("span", i === extra.elegida ? "elegida" : "", o);
        ops.appendChild(s);
      });
      el.appendChild(ops);
    }
    var meta = nodo("span", "meta", hora);
    if (lado === "salida") meta.appendChild(nodo("span", "ticks", "✓✓"));
    el.appendChild(meta);
    chat.appendChild(el);
    bajar();
    return el;
  }

  function reproducir(indicePiso) {
    limpiar();
    var yo = ejecucion;
    var piso = PISOS[indicePiso];
    marcarPiso(indicePiso);

    var presupuesto = redondeaArriba(piso.precio * 1.06, 10000);
    var h = huecos();
    var reloj = parseHora(LEAD.hora || "21:47");
    var inicio = new Date(reloj.getTime());
    var primeraRespuestaSeg = Number(LEAD.primera_respuesta_seg) || 40;

    // Cada paso: [espera en ms antes del paso, función]
    var pasos = [];
    var t = 0;
    function paso(espera, fn) { t += espera; pasos.push([t, fn]); }
    function avanza(seg) { reloj = new Date(reloj.getTime() + seg * 1000); return hhmm(reloj); }
    var escribiendoEl = null;
    function escribiendo(lado) {
      quitaEscribiendo();
      escribiendoEl = nodo("div", "escribiendo" + (lado === "entrada" ? " entrada" : ""));
      escribiendoEl.innerHTML = "<i></i><i></i><i></i>";
      chat.appendChild(escribiendoEl);
      bajar();
      $("caja-texto").textContent = lado === "entrada" ? primerNombre + " está escribiendo…" : asistente + " está escribiendo…";
    }
    function quitaEscribiendo() {
      if (escribiendoEl && escribiendoEl.parentNode) escribiendoEl.parentNode.removeChild(escribiendoEl);
      escribiendoEl = null;
      $("caja-texto").textContent = "Asistente automático activo 24/7";
    }
    function bot(espera, texto, extra, seg) {
      paso(espera, function () { escribiendo("salida"); });
      paso(1400, function () { quitaEscribiendo(); burbuja("salida", texto, avanza(seg || 6), extra); });
    }
    function cliente(espera, texto, seg) {
      paso(espera, function () { escribiendo("entrada"); });
      paso(1500, function () { quitaEscribiendo(); burbuja("entrada", texto, avanza(seg || 40)); });
    }

    paso(300, function () { chat.appendChild(nodo("div", "fecha", "HOY")); });
    paso(500, function () {
      chat.appendChild(nodo("div", "sistema", "Nuevo lead de Idealista · " + piso.ref + " · " + piso.direccion));
      bajar();
    });
    paso(700, function () {
      burbuja("entrada",
        "Hola, me interesa el piso de " + piso.direccion + " (" + piso.barrio + "). ¿Sigue disponible? ¿Se puede ver esta semana?",
        hhmm(reloj), { etiqueta: "Vía Idealista" });
    });
    paso(900, function () { escribiendo("salida"); });
    paso(1400, function () {
      quitaEscribiendo();
      burbuja("salida",
        "¡Hola " + primerNombre + "! Soy " + asistente + ", asistente virtual de " + AG.nombre + ". " +
        "Sí, el piso de " + piso.direccion + " sigue disponible: " + piso.m2 + " m², " +
        piso.habitaciones + " hab., " + eur(piso.precio) + ".\n\n" +
        "Para organizarte la visita con " + agente + " te hago 4 preguntas rápidas.",
        avanza(primeraRespuestaSeg));
      var c = nodo("div", "crono", "Respondido en " + primeraRespuestaSeg + " s · fuera de horario, sin intervención humana");
      chat.appendChild(c); bajar();
    });
    bot(900, "1/4 · ¿Cuál es tu presupuesto máximo aproximado?", null, 3);
    cliente(1200, "Hasta unos " + eur(presupuesto) + ".", 35);
    bot(700, "2/4 · ¿Cómo lo financiarías? ¿Hipoteca ya preaprobada, en estudio o al contado?", null, 5);
    cliente(1200, "Tengo la hipoteca preaprobada con mi banco, el 80 %.", 50);
    bot(700, "3/4 · ¿En qué plazo te gustaría comprar?", null, 4);
    cliente(1200, "En los próximos 2-3 meses.", 30);
    bot(700, "4/4 · ¿Buscas solo en " + piso.barrio + " o te valen otras zonas?", null, 4);
    cliente(1200, piso.barrio + " o alrededores, cerca del metro.", 40);
    bot(800, "¡Perfecto, encajas con este piso! " + agente + " puede enseñártelo en estos huecos. ¿Cuál te viene mejor?",
      { opciones: ["1) " + cap(h[0]), "2) " + cap(h[1])] }, 6);
    cliente(1300, "La 1, gracias.", 25);
    bot(700,
      "Hecho. Visita confirmada:\n" + cap(h[0]) + "\n" + piso.direccion + "\nCon " + agente + ".\n\n" +
      "Te enviaré un recordatorio el día antes. Si necesitas cambiarla, escribe aquí.",
      null, 7);
    paso(900, function () {
      chat.appendChild(nodo("div", "sistema ok", "Visita añadida al calendario de " + agente + " · Ficha enviada al agente"));
      bajar();
      $("btn-ficha").disabled = false;
      var totalMin = Math.max(1, Math.round((reloj - inicio) / 60000));
      rellenaFicha(piso, presupuesto, h[0], primeraRespuestaSeg, totalMin);
    });
    paso(1600, function () { $("ficha-fondo").hidden = false; });

    pasos.forEach(function (p) {
      temporizadores.push(setTimeout(function () { if (yo === ejecucion) p[1](); }, p[0] / velocidad));
    });
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function rellenaFicha(piso, presupuesto, visita, respSeg, totalMin) {
    $("ficha-sup").textContent = (AG.nombre || "Agencia") + " · Lead de Idealista";
    $("ficha-nombre").textContent = nombreLead;
    var encaja = presupuesto >= piso.precio;
    $("ficha-insignia").textContent = encaja ? "CUALIFICADO · CALIENTE" : "CUALIFICADO · REVISAR PRESUPUESTO";
    $("m-resp").textContent = respSeg + " s";
    $("m-total").textContent = totalMin + " min";
    var datos = [
      ["Piso", piso.ref + " · " + piso.direccion + " (" + piso.barrio + ")"],
      ["Precio", eur(piso.precio) + " · " + piso.m2 + " m² · " + piso.habitaciones + " hab."],
      ["Presupuesto", "Hasta " + eur(presupuesto) + (encaja ? " (encaja)" : " (por debajo)")],
      ["Financiación", "Hipoteca preaprobada (80 %)"],
      ["Plazo", "2-3 meses"],
      ["Zona", piso.barrio + " y alrededores"],
      ["Visita", cap(visita)],
      ["Contacto", "WhatsApp · +34 6XX XXX XXX (ficticio)"],
      ["Origen", "Idealista · recibido a las " + (LEAD.hora || "21:47")]
    ];
    var dl = $("ficha-datos");
    dl.innerHTML = "";
    datos.forEach(function (d) {
      dl.appendChild(nodo("dt", "", d[0]));
      dl.appendChild(nodo("dd", "", d[1]));
    });
    $("ficha-resumen").textContent =
      "Comprador con hipoteca preaprobada y presupuesto " + (encaja ? "suficiente" : "algo justo") +
      ", quiere comprar en 2-3 meses en " + piso.barrio + ". Visita ya agendada: solo tienes que presentarte.";
  }

  // ---------- Selector de pisos ----------
  var actual = 0;
  function marcarPiso(i) {
    actual = i;
    Array.prototype.forEach.call($("pisos").children, function (b, j) {
      b.classList.toggle("activo", j === i);
      b.setAttribute("aria-pressed", j === i ? "true" : "false");
    });
  }
  PISOS.forEach(function (p, i) {
    var b = nodo("button", "", p.barrio + " · " + eur(p.precio));
    b.type = "button";
    b.addEventListener("click", function () { reproducir(i); });
    $("pisos").appendChild(b);
  });
  if (PISOS.length < 2) $("pisos").style.display = "none";

  // ---------- Controles ----------
  $("btn-reiniciar").addEventListener("click", function () { reproducir(actual); });
  $("btn-repetir").addEventListener("click", function () { reproducir(actual); });
  $("btn-cerrar").addEventListener("click", function () { $("ficha-fondo").hidden = true; });
  $("btn-ficha").addEventListener("click", function () { $("ficha-fondo").hidden = false; });
  $("btn-velocidad").addEventListener("click", function () {
    velocidad = velocidad === 1 ? 2 : 1;
    this.textContent = "x" + velocidad;
    reproducir(actual);
  });

  // Modo rápido para pruebas automáticas: index.html#rapido
  if (location.hash === "#rapido") velocidad = 20;

  if (PISOS.length) reproducir(0);
})();
</script>
</body>
</html>
